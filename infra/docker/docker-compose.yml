services:
  postgres:
    image: postgres:16-alpine
    container_name: alpacto-postgres
    environment:
      POSTGRES_USER: alpacto
      POSTGRES_PASSWORD: alpacto
      POSTGRES_DB: alpacto
    ports:
      - "5432:5432"
    volumes:
      - alpacto_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpacto -d alpacto"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alpacto-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: alpacto-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: alpacto
      MINIO_ROOT_PASSWORD: alpacto123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - alpacto_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    container_name: alpacto-minio-init
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 alpacto alpacto123; do sleep 1; done;
      mc mb --ignore-existing local/alpacto-evidence;
      exit 0;
      "

volumes:
  alpacto_pg_data:
  alpacto_minio_data:
